# Supabase CLI local development config. Run `npx supabase start`.
project_id = "teamhub"

[api]
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
