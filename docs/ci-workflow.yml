name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run test:db
      - run: npx vite build --mode demo --outDir demo-dist
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          npx vite preview --outDir demo-dist --port 4173 &
          sleep 3
          python tests/e2e_demo.py http://localhost:4173
